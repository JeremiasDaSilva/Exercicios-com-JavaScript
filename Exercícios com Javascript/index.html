<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Exercícios JavaScript</title>
  <link rel="stylesheet" href="style.css">
  <script src="javascript.js" defer></script>
</head>
<body>



  <div class="laterais">
    <div class="faixa escura"></div>
    <div class="faixa clara"></div>
  </div>



  <main class="container">
    <h1>Exercícios usando JavaScript</h1>



    <section class="card">
      <h2>Exercício 1 - Apresentação</h2>
      <input type="text" id="input-nome" placeholder="Digite seu nome">
      <button onclick="apresentar()">Enviar</button>
      <p id="resposta-card1"></p>
    </section>



    <section class="card">
      <h2>Exercício 2 - Soma</h2>
      <div class="inputs-linha">
        <input type="number" id="soma-num1" placeholder="1º número">
        <input type="number" id="soma-num2" placeholder="2º número">
      </div>
      <button onclick="somar()">Somar</button>
      <p id="resposta-card2"></p>
    </section>



    <section class="card">
      <h2>Exercício 3 - Subtração</h2>
      <div class="inputs-linha">
        <input type="number" id="num1" placeholder="1º número">
        <input type="number" id="num2" placeholder="2º número">
      </div>
      <button onclick="subtrair()">Subtrair</button>
      <p id="resposta-card3"></p>
    </section>
  </main>



  <div class="laterais">
    <div class="faixa clara"></div>
    <div class="faixa escura"></div>
  </div>



</body>
</html>
